<text x="24.0" y="598.0" font-size="11" fill="#6e7681" text-anchor="start">Это выпуск f1. Ядра декода main128 (o-proj GEMV, MoE GEMV) в Nsight Compute не снимались: под ncu сервер не обрабатывает запросы (results/ladder/ncu.json).</text>
