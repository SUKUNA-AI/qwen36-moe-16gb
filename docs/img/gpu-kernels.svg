<text x="24.0" y="484.0" font-size="11" fill="#8c959f" text-anchor="start">Источник: results/ladder/ncu-kernels.json. ncu фиксирует базовые частоты, поэтому длительности больше, чем в работе.</text>
<text x="24.0" y="500.0" font-size="11" fill="#8c959f" text-anchor="start">main128 снят без перекрытия shared-эксперта и подкачки (под ncu ядра исполняются по очереди): ядра те же, перекрытие отключено, memory_ratio 0.75.</text>
<text x="24.0" y="516.0" font-size="11" fill="#8c959f" text-anchor="start">FP8 GEMV: у f1 и main128 ядро одного класса (разные экземпляры запуска); DRAM подкачки зависит от memory_ratio. Prefill-ядра по модели не снимались.</text>
