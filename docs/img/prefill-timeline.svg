<text x="24.0" y="452.0" font-size="11" fill="#8c959f" text-anchor="start">Короткий промпт ждёт PCIe: копия слоя (~8 мс) дольше его счёта (~3 мс). Куски короче 160 токенов везут только выбранных роутером экспертов; уже лежащие в VRAM эксперты копируются внутри GPU.</text>
