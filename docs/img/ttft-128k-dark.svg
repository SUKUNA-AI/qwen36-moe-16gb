<text x="24.0" y="722.0" font-size="11" fill="#6e7681" text-anchor="start">Короткие случаи: в матрице 13.10 не было прогрева 60 с, f1 там медленнее (64 токена: 0.79 против 0.41 с), поэтому приведённые значения — оценка; прямой замер main128 после прогрева — 0.200 с.</text>
